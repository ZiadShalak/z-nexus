name: 🚀 Auto‑Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          # write the secret, strip CRs, save as the key
          echo "${{ secrets.SSH_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Add GitHub & Server to known_hosts
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan 78.101.17.233 >> ~/.ssh/known_hosts

      - name: Push to production bare repo
        env:
          # tell git over which SSH to talk
          GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no'
        run: |
          git remote add production ssh://ziad@78.101.17.233/opt/git/z-nexus.git
          git push production HEAD:main --force
