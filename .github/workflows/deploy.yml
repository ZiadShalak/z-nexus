name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code from your GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up the SSH key and add your server to known_hosts
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.SERVER_KNOWN_HOSTS }}

      # 3. Add your production server as a Git remote
      - name: Add Production Remote
        run: git remote add production ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}/opt/git/z-nexus.git

      # 4. Push to your server to trigger its post-receive hook
      - name: Push to Production
        run: git push production main