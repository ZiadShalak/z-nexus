name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host z-nexus.com\n  Port ${{ secrets.SSH_PORT }}\n  StrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Backup remote site
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo mkdir -p ${{ secrets.BACKUP_PATH }} && \
             tar czf ${{ secrets.BACKUP_PATH }}/z-nexus-$(date +%Y%m%d-%H%M%S).tar.gz \
               -C $(dirname ${{ secrets.DEPLOY_PATH }}) $(basename ${{ secrets.DEPLOY_PATH }})"

      - name: Upload via SCP
        run: |
          scp -P ${{ secrets.SSH_PORT }} -r * ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Fix remote permissions
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chmod -R a+rX ${{ secrets.DEPLOY_PATH }}"
