name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host z-nexus\n  HostName deploy.z-nexus.com\n  User ${{ secrets.SSH_USER }}\n  Port ${{ secrets.SSH_PORT }}\n  StrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Backup remote site
        run: |
          ssh z-nexus \
            "mkdir -p ${{ secrets.BACKUP_PATH }} && \
             tar czf ${{ secrets.BACKUP_PATH }}/z-nexus-$(date +%Y%m%d-%H%M%S).tar.gz \
             -C $(dirname ${{ secrets.DEPLOY_PATH }}) $(basename ${{ secrets.DEPLOY_PATH }})"

      - name: Upload via SCP
        run: |
          scp -r * z-nexus:${{ secrets.DEPLOY_PATH }}

      - name: Fix ownership
        run: |
          ssh z-nexus "
            if [[ \$(stat -c '%U' '${{ secrets.DEPLOY_PATH }}') != '${{ secrets.SSH_USER }}' ]]; then
              echo '${{ secrets.SSH_PASSWORD }}' | sudo -S chown -R '${{ secrets.SSH_USER }}':'${{ secrets.SSH_USER }}' '${{ secrets.DEPLOY_PATH }}';
            else
              echo '✅ Ownership OK';
            fi
          "

      - name: Fix remote permissions
        run: |
          ssh z-nexus "echo '${{ secrets.SSH_PASSWORD }}' | sudo -S chmod -R a+rX '${{ secrets.DEPLOY_PATH }}'"
