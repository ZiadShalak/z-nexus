name: Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- ADD THIS NEW DEBUGGING STEP ---
      - name: Debug Secrets
        run: |
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then
            echo "SERVER_SSH_KEY secret is NOT set or is empty."
          else
            echo "SERVER_SSH_KEY secret IS set."
          fi

      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_SSH_KEY }}
          known_hosts: ${{ secrets.SERVER_KNOWN_HOSTS }}

      - name: Add Production Remote
        run: git remote add production ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}/opt/git/z-nexus.git

      - name: Push to Production
        run: git push production main