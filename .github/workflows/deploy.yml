name: 🚀 Auto‑Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Prepare SSH key & known_hosts
        run: |
          mkdir -p ~/.ssh
          # write the secret, strip CR's, save as id_deploy
          echo "${{ secrets.SSH_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # trust GitHub and your server
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H 78.101.17.233 >> ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          # point SSH at our key
          GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no'
        run: |
          git remote add production ssh://ziad@78.101.17.233/opt/git/z-nexus.git
          git push production HEAD:main --force
