name: 🚀 Auto‑Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Grab your code
      - name: Check out code
        uses: actions/checkout@v3

      # 2) Run the deploy hook on your server via SSH
      - name: Trigger remote deploy hook
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # this will back up and deploy via your existing post-receive hook
            bash /opt/git/z-nexus.git/hooks/post-receive
