name: 🚀 Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host z-nexus\n  HostName 78.101.17.33\n  User ${{ secrets.SSH_USER }}\n  Port ${{ secrets.SSH_PORT }}\n  StrictHostKeyChecking no\n" > ~/.ssh/config

      - name: Backup remote site
        run: |
          ssh z-nexus \
            "mkdir -p ${{ secrets.BACKUP_PATH }} && \
             tar czf ${{ secrets.BACKUP_PATH }}/z-nexus-$(date +%Y%m%d-%H%M%S).tar.gz \
             -C $(dirname ${{ secrets.DEPLOY_PATH }}) $(basename ${{ secrets.DEPLOY_PATH }})"

      - name: Upload via SCP
        run: |
          scp -r * z-nexus:${{ secrets.DEPLOY_PATH }}

      - name: Fix remote permissions
        run: |
          ssh z-nexus \
            "chmod -R a+rX ${{ secrets.DEPLOY_PATH }}"