name: 🚀 Auto‑Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          # Write the secret into id_deploy, strip Windows CRs
          echo "${{ secrets.SSH_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Populate known_hosts
        run: |
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H 78.101.17.233 >> ~/.ssh/known_hosts

      - name: Deploy via production remote
        env:
          # Force SSH to use our deploy key and skip host‑checking prompts
          GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no'
        run: |
          git remote add production ssh://ziad@78.101.17.233/opt/git/z-nexus.git
          git push production HEAD:main --force
